# Auto-loaded by `docker compose up` on a bare VPS / locally (NOT by Coolify,
# which invokes compose with an explicit `-f docker-compose.yml`).
#
# It publishes the app on a host port so you can reach http://<host>:${PORT:-8000}
# without a reverse proxy. Change PORT in .env if 8000 is taken.
services:
  bayan:
    ports:
      - "${PORT:-8000}:8000"
